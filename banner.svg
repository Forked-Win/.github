<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="forked.win: we fork it, we fix it, we send it back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a2e"/><stop offset=".62" stop-color="#14213f"/><stop offset="1" stop-color="#1b1637"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".5" r=".45">
      <stop offset="0" stop-color="#9a8cff" stop-opacity=".28"/><stop offset="1" stop-color="#9a8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6f0e2" fill-opacity=".07"/></pattern>
  </defs>
  <style>
    .t1{font:800 84px 'Helvetica Neue',Arial,sans-serif;letter-spacing:-3px;fill:#e6f0e2}
    .t2{font:600 27px 'Helvetica Neue',Arial,sans-serif;fill:#e6f0e2}
    .t3{font:400 19px 'Helvetica Neue',Arial,sans-serif;fill:#8fb0a8}
    .lb{font:400 13px ui-monospace,Menlo,monospace;fill:#8fb0a8}
    .ln{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s cubic-bezier(.5,0,.2,1) forwards}
    .m{stroke:#e6f0e2}.v{stroke:#9a8cff}.a{stroke:#f4b942}
    .d2{animation-delay:.6s}.d3{animation-delay:1.1s}.d4{animation-delay:1.6s}
    .nd{fill:#0f2530;stroke-width:3;opacity:0;animation:pop .5s forwards}
    .fade{opacity:0;animation:pop .8s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1}}
    .win{animation:pop .5s 3s forwards,pulse 2.4s 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
    @keyframes pulse{50%{transform:scale(1.4)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{stroke-dashoffset:0}.nd,.fade,.win{opacity:1}}
  </style>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="21.5" fill="none" stroke="#e6f0e2" stroke-opacity=".14"/>

  <text x="64" y="168" class="t1">forked<tspan fill="#f4b942">.</tspan>win</text>
  <text x="68" y="222" class="t2">We fork it. We fix it. We send it back.</text>
  <text x="68" y="262" class="t3">An open-source group that makes other people's projects better.</text>

  <path class="ln m" pathLength="1" d="M700 170 H1240"/>
  <path class="ln v d2" pathLength="1" d="M780 170 C820 170 830 80 880 80 H1010 C1060 80 1070 170 1110 170"/>
  <path class="ln a d3" pathLength="1" d="M860 170 C900 170 910 262 960 262 H1090 C1140 262 1150 170 1190 170"/>
  <path class="ln v d4" pathLength="1" d="M1000 170 C1025 170 1030 128 1060 128 H1110 C1140 128 1148 170 1175 170"/>
  <g class="nd" style="animation-delay:.2s"><circle cx="700" cy="170" r="8" class="nd m" style="animation-delay:.2s"/></g>
  <circle class="nd m" cx="780" cy="170" r="8" style="animation-delay:.6s"/>
  <circle class="nd v" cx="880" cy="80" r="8" style="animation-delay:1.2s"/>
  <circle class="nd v" cx="1010" cy="80" r="8" style="animation-delay:1.6s"/>
  <circle class="nd a" cx="960" cy="262" r="8" style="animation-delay:1.8s"/>
  <circle class="nd a" cx="1090" cy="262" r="8" style="animation-delay:2.2s"/>
  <circle class="win" cx="1236" cy="170" r="12" fill="#f4b942"/>
  <text x="700" y="202" class="lb fade" style="animation-delay:.4s">main</text>
  <text x="880" y="58" class="lb fade" style="animation-delay:1.4s">fix/null-check</text>
  <text x="960" y="292" class="lb fade" style="animation-delay:2s">docs/setup-guide</text>
  <text x="1176" y="146" class="lb fade" style="animation-delay:3.1s">merged</text>
</svg>
